name: Android APK Release

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Generate native Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          # Release embeds the JS bundle via export:embed; debug expects Metro on :8081.
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK file
        id: apk
        working-directory: mobile
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          SRC="$GITHUB_WORKSPACE/mobile/android/app/build/outputs/apk/release/app-release.apk"
          OUT_DIR="$GITHUB_WORKSPACE/mobile/dist"
          APK_NAME="elifba-kids-${VERSION}-${SHORT_SHA}.apk"
          APK_ABS="${OUT_DIR}/${APK_NAME}"

          test -f "$SRC"
          mkdir -p "$OUT_DIR"
          cp "$SRC" "$APK_ABS"

          file "$APK_ABS"
          [[ "$APK_NAME" == *.apk ]]
          ls -lh "$APK_ABS"

          # Standalone APK must ship an embedded JS bundle (not Metro dev client).
          if ! unzip -l "$APK_ABS" | grep -qE 'assets/.*(index\.android\.bundle|\.hbc)'; then
            echo "ERROR: No embedded JS bundle found in APK assets."
            unzip -l "$APK_ABS" | grep -E 'assets/' || true
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "apk_name=${APK_NAME}"
            echo "apk_abs=${APK_ABS}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elifba-kids-apk
          path: ${{ steps.apk.outputs.apk_abs }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: Elifba Kids APK (${{ github.run_number }})
          body: |
            Automatischer APK-Build von `main` (lokal in GitHub Actions).

            - Version: `${{ steps.apk.outputs.version }}`
            - Commit: `${{ steps.apk.outputs.short_sha }}`
            - Workflow: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: ${{ steps.apk.outputs.apk_abs }}
          fail_on_unmatched_files: true
