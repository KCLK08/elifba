name: Android APK Release

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Android APK (EAS)
        id: eas
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile apk \
            --non-interactive \
            --wait \
            --json > /tmp/eas-build.json

          BUILD_ID=$(node -e "const j=require('/tmp/eas-build.json'); const b=Array.isArray(j)?j[0]:j; if(!b?.id) process.exit(1); process.stdout.write(b.id)")
          ARTIFACT_URL=$(node -e "const j=require('/tmp/eas-build.json'); const b=Array.isArray(j)?j[0]:j; process.stdout.write(b?.artifacts?.buildUrl || b?.artifacts?.applicationArchiveUrl || '')")

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"
          echo "EAS build id: $BUILD_ID"

      - name: Download APK
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "${{ steps.eas.outputs.artifact_url }}" ]; then
            curl -L --fail --retry 3 -o dist/elifba-kids.apk "${{ steps.eas.outputs.artifact_url }}"
          else
            eas build:download \
              --id "${{ steps.eas.outputs.build_id }}" \
              --platform android \
              --output dist/elifba-kids.apk \
              --non-interactive
          fi
          ls -lh dist/elifba-kids.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elifba-kids-apk
          path: mobile/dist/elifba-kids.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: Elifba Kids APK (${{ github.run_number }})
          body: |
            Automatischer APK-Build von `main`.

            - Commit: ${{ github.sha }}
            - EAS Build: ${{ steps.eas.outputs.build_id }}
          files: mobile/dist/elifba-kids.apk
          fail_on_unmatched_files: true
